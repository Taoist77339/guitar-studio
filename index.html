<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice Studio</title>
<meta name="description" content="A complete acoustic guitar course: 8 units from your first chord to barre chords, fingerstyle and the blues, with a built-in tuner, chord player and play-along metronome.">
<meta name="theme-color" content="#111614">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar; one reading column (lessons) or panel stack (course map, tools). Brass = the string metal, used for anything you can play. */
:root {
  --bg: #eef1ef; --panel: #ffffff; --ink: #18211e; --muted: #5b6863; --line: #d3dad6;
  --brass: #9a6b16; --brass-soft: #f3e6c8; --good: #217a4b; --warn: #b5482a; --fret: #b9c2bd; --wood: #e3ddd2;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --panel: #1a211e; --ink: #e5ebe8; --muted: #93a19b; --line: #2c3632;
  --brass: #dcaa4c; --brass-soft: #3a2f18; --good: #4fc184; --warn: #ef7b5a; --fret: #46524d; --wood: #262019; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --panel: #1a211e; --ink: #e5ebe8; --muted: #93a19b; --line: #2c3632;
  --brass: #dcaa4c; --brass-soft: #3a2f18; --good: #4fc184; --warn: #ef7b5a; --fret: #46524d; --wood: #262019; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 8px; min-height: 56px; flex-wrap: wrap }
.brand { font: 700 19px var(--display); color: var(--ink); text-decoration: none; margin-right: auto; display: flex; align-items: center; gap: 8px }
.brand img { width: 26px; height: 26px; border-radius: 6px }
.nav a { font-weight: 500; font-size: 14.5px; color: var(--muted); text-decoration: none; padding: 7px 12px; border-radius: 7px }
.nav a.on { color: var(--ink); background: var(--brass-soft) }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 72px }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px }
.read { max-width: 760px }
h1 { font: 700 clamp(30px, 5vw, 44px)/1.08 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font: 700 22px/1.2 var(--display); margin: 0; text-wrap: balance }
h3 { font: 700 18px/1.3 var(--display); margin: 8px 0 0 }
.eyebrow { font: 500 12.5px var(--mono); color: var(--brass); letter-spacing: 0.08em; text-transform: uppercase }
.muted { color: var(--muted) }
p { margin: 0 }
code { font: 500 0.92em var(--mono); background: var(--brass-soft); padding: 1px 5px; border-radius: 4px }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0 }
button, .btn { font: 500 14px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
button:hover, .btn:hover { border-color: var(--brass) }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px }
.primary { background: var(--brass); border-color: var(--brass); color: var(--panel); font-weight: 600 }
button.on { background: var(--brass-soft); border-color: var(--brass) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.hint { color: var(--muted); font-size: 14px }
input[type=range] { accent-color: var(--brass); width: 100%; min-width: 0 }
input[type=text], select { font: 15px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; min-width: 0 }

/* home */
.hero { display: grid; gap: 10px }
.hero p { color: var(--muted); max-width: 62ch; font-size: 17px }
.progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 4px }
.continue { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center }
@media (max-width: 560px) { .continue { grid-template-columns: 1fr } }
.routine { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
@media (max-width: 680px) { .routine { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.routine div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px }
.routine b { font: 700 22px var(--display); font-variant-numeric: tabular-nums }
.routine span { font-size: 13.5px; color: var(--muted) }
.units { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
@media (max-width: 760px) { .units { grid-template-columns: 1fr } }
.unit { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.unit header { display: grid; gap: 4px }
.unit header p { color: var(--muted); font-size: 14.5px }
.unit ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.unit li a { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 15px }
.unit li a:hover { background: var(--bg) }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 11px var(--mono); color: var(--muted) }
.done .dot { background: var(--good); border-color: var(--good); color: var(--panel) }
.unit li small { color: var(--muted); font: 400 12px var(--mono) }

/* lesson */
.lesson { display: grid; gap: 18px }
.lesson-head { display: grid; gap: 8px }
.meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px }
.goal { border-left: 3px solid var(--brass); padding: 4px 0 4px 14px; font-size: 16.5px }
.lesson .body { display: grid; gap: 14px }
.body ul, .body ol { margin: 0; padding-left: 22px; display: grid; gap: 6px }
.tip { background: var(--brass-soft); border-radius: 8px; padding: 12px 14px; font-size: 15px }
.tip b:first-child { font-family: var(--display) }
.widget { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0 }
.widget-title { font: 600 13px var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.ready { display: grid; gap: 8px }
.ready label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer }
.ready input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--good) }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }

/* chord diagrams */
.chords { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px }
.chord { border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px 6px; display: grid; justify-items: center; gap: 0; cursor: pointer; background: transparent; color: var(--ink) }
.chord .nm { font: 700 19px var(--display) }
.chord .tag { font: 400 11px var(--mono); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; min-height: 1.2em }
.chord svg { width: 100%; max-width: 108px; height: auto }
.filters { display: flex; gap: 6px; flex-wrap: wrap }

/* tab + fretboard + player */
.scroll { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch }
.tab svg, .fb svg { display: block }
.tab text, .fb text { font-family: var(--mono) }
.tab .ev.lit rect { fill: var(--brass) }
.tab .ev.lit text { fill: var(--panel) }
.controls { display: grid; grid-template-columns: auto auto minmax(80px, 1fr) auto; gap: 10px; align-items: center }
@media (max-width: 520px) { .controls { grid-template-columns: auto minmax(0, 1fr) auto } .controls .bpmv { grid-column: 3 } .controls input { grid-column: 1 / -1; order: 5 } }
.bpmv { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.prog { display: flex; gap: 6px; flex-wrap: wrap; font: 600 17px var(--display) }
.prog span { padding: 3px 11px; border: 1px solid var(--line); border-radius: 6px }
.prog span.lit { border-color: var(--brass); background: var(--brass-soft) }
.pattern { display: grid; gap: 4px; font: 500 16px var(--mono); text-align: center }
.pattern div { padding: 6px 0 4px; border-radius: 6px; border: 1px solid var(--line); min-width: 0 }
.pattern div.rest { color: var(--muted); border-style: dashed }
.pattern div.lit { background: var(--brass-soft); border-color: var(--brass) }
.pattern em { display: block; font-style: normal; font-size: 11px; color: var(--muted) }
.beats { display: flex; gap: 6px }
.beat { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line) }
.beat.lit { background: var(--brass); border-color: var(--brass) }

/* tuner */
.tuner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center }
@media (max-width: 680px) { .tuner { grid-template-columns: 1fr } }
.readout { text-align: center }
.note { font: 700 80px/1 var(--display); letter-spacing: -0.02em }
.note sub { font-size: 26px; color: var(--muted); vertical-align: baseline }
.hz { font: 400 13.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.verdict { font-weight: 600; min-height: 1.5em }
.verdict.good { color: var(--good) } .verdict.off { color: var(--warn) }
.meter { position: relative; height: 54px; margin-top: 6px }
.scale { position: absolute; inset: 22px 0 auto; height: 10px; border-top: 2px solid var(--line) }
.tick { position: absolute; top: -2px; width: 1px; height: 10px; background: var(--muted) }
.tick.c { height: 16px; background: var(--good); width: 2px }
.zone { position: absolute; top: 14px; height: 18px; left: 45%; width: 10%; background: color-mix(in srgb, var(--good) 18%, transparent); border-radius: 4px }
.needle { position: absolute; top: 4px; width: 4px; height: 44px; background: var(--brass); border-radius: 2px; left: 50%; transform: translateX(-50%); transition: left .12s linear }
.scale-labels { display: flex; justify-content: space-between; font: 400 11px var(--mono); color: var(--muted); margin-top: 2px }
.strings { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px }
.strings button { display: grid; gap: 0; padding: 8px 2px; justify-items: center }
.strings b { font: 700 19px var(--display) }
.strings span { font: 400 10.5px var(--mono); color: var(--muted) }
.strings button.target { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent) }
.err { color: var(--warn); font-size: 14px }

/* quizzes + timers */
.big { font: 700 44px/1 var(--display); font-variant-numeric: tabular-nums }
.answers { display: flex; flex-wrap: wrap; gap: 6px }
.answers button.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, transparent) }
.answers button.wrong { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent) }
.score { font: 500 14px var(--mono); color: var(--muted) }

.seen .dot { border-color: var(--brass); color: var(--brass) }
.log { display: grid; gap: 4px }
.log a { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 10px; margin: 0 -10px; border-radius: 7px; color: var(--ink); text-decoration: none }
.log a:hover { background: var(--bg) }
.log span { display: grid; min-width: 0 }
.log small { color: var(--muted); font-size: 12.5px }
.lg-n { text-align: right; font: 700 20px var(--display); font-variant-numeric: tabular-nums }
.lg-n small { font: 400 11.5px var(--body) }
/* play with mic */
.game-btn { border-color: var(--brass); color: var(--brass); font-weight: 600 }
.game-ov { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.game-box { max-width: 1040px; margin: 0 auto; display: grid; gap: 12px }
.game-head { display: flex; justify-content: space-between; align-items: center; gap: 12px }
.hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
@media (max-width: 560px) { .hud { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.hud div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: grid }
.hud b { font: 700 24px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hud span { font-size: 12.5px; color: var(--muted) }
.lane-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0 }
.lane { display: block; width: 100% }
.live { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr) minmax(0, 1.3fr); gap: 10px }
@media (max-width: 760px) { .live { grid-template-columns: 1fr } }
.live > div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0 }
.lp-n { font: 700 30px var(--display); line-height: 1.1 }
.cm { position: relative; height: 26px; margin-top: 4px }
.cm-z { position: absolute; left: 35%; width: 30%; top: 4px; bottom: 4px; background: color-mix(in srgb, var(--good) 18%, transparent); border-radius: 4px }
.cm-0 { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--good) }
.cm-n { position: absolute; top: 0; bottom: 0; width: 6px; border-radius: 3px; transform: translateX(-50%); left: 50%; background: var(--brass); transition: left .08s linear }
.chroma { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; height: 70px; align-items: end }
.chroma div { display: grid; grid-template-rows: 1fr auto; height: 100%; text-align: center; gap: 2px }
.chroma i { align-self: end; display: block; background: var(--fret); border-radius: 2px 2px 0 0; min-height: 2px }
.chroma div.want i { background: var(--brass) }
.chroma div.want span { color: var(--brass); font-weight: 600 }
.chroma span { font: 500 10px var(--mono); color: var(--muted) }
.g-fix { text-align: left }
@media (prefers-reduced-motion: reduce) { .needle, .cm-n { transition: none } }
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="brand" href="#home"><img src="icon-192.png" alt="">Practice Studio</a>
  <nav class="nav row" aria-label="Main"><a href="#home" id="nav-home">Course</a><a href="#tools" id="nav-tools">Tools</a></nav>
  <button class="primary" id="install" hidden>Install app</button>
</div></div>
<main><div class="wrap" id="view"></div></main>

<script src="course.js"></script>
<script>
"use strict";
// ================================================================= helpers
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/`(.+?)`/g, "<code>$1</code>");
const store = {
  get(k, d) { try { const v = localStorage.getItem("gs-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("gs-" + k, JSON.stringify(v)); } catch (e) { store.ok = false; } if (!store.asked) { store.asked = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} } },
  ok: (() => { try { localStorage.setItem("gs-probe", "1"); const ok = localStorage.getItem("gs-probe") === "1"; localStorage.removeItem("gs-probe"); return ok; } catch (e) { return false; } })(),
  dump() { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("gs-")) o[k] = localStorage.getItem(k); } } catch (e) {} return o; },
};
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const OPEN = [40, 45, 50, 55, 59, 64];          // string 6 → 1
const SNAME = ["E", "A", "D", "G", "B", "E"];
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const midiOf = (s, f) => OPEN[6 - s] + f;      // s = string number 1..6
const pcOf = n => NOTES.indexOf(n.replace("Db", "C#").replace("Eb", "D#").replace("Gb", "F#").replace("Ab", "G#").replace("Bb", "A#"));

// ================================================================= chords
// f: frets string 6→1 (null = don't play); g: fingers; name/tag optional
const CHORDS = {
  Em: { f: [0,2,2,0,0,0], g: [0,2,3,0,0,0], grp: "open" },
  E: { f: [0,2,2,1,0,0], g: [0,2,3,1,0,0], grp: "open" },
  Am: { f: [null,0,2,2,1,0], g: [0,0,2,3,1,0], grp: "open" },
  A: { f: [null,0,2,2,2,0], g: [0,0,1,2,3,0], grp: "open" },
  C: { f: [null,3,2,0,1,0], g: [0,3,2,0,1,0], grp: "open" },

  D: { f: [null,null,0,2,3,2], g: [0,0,0,1,3,2], grp: "open" },
  Dm: { f: [null,null,0,2,3,1], g: [0,0,0,2,3,1], grp: "open" },
  Fsmall: { name: "F", tag: "small", f: [null,null,3,2,1,1], g: [0,0,3,2,1,1], grp: "open" },
  Fmaj7: { f: [null,null,3,2,1,0], g: [0,0,3,2,1,0], grp: "open" },
  "G/B": { f: [null,2,0,0,0,3], g: [0,1,0,0,0,3], grp: "open" },
  E7: { f: [0,2,0,1,0,0], g: [0,2,0,1,0,0], grp: "seventh" },
  A7: { f: [null,0,2,0,2,0], g: [0,0,2,0,3,0], grp: "seventh" },
  D7: { f: [null,null,0,2,1,2], g: [0,0,0,2,1,3], grp: "seventh" },
  B7: { f: [null,2,1,2,0,2], g: [0,2,1,3,0,4], grp: "seventh" },
  G7: { f: [3,2,0,0,0,1], g: [3,2,0,0,0,1], grp: "seventh" },
  C7: { f: [null,3,2,3,1,0], g: [0,3,2,4,1,0], grp: "seventh" },
  Am7: { f: [null,0,2,0,1,0], g: [0,0,2,0,1,0], grp: "seventh" },
  Em7: { f: [0,2,2,0,3,3], g: [0,1,2,0,3,4], grp: "seventh" },
  Cmaj7: { f: [null,3,2,0,0,0], g: [0,3,2,0,0,0], grp: "seventh" },
  Asus2: { f: [null,0,2,2,0,0], g: [0,0,1,2,0,0], grp: "sus" },
  Asus4: { f: [null,0,2,2,3,0], g: [0,0,1,2,3,0], grp: "sus" },
  Dsus2: { f: [null,null,0,2,3,0], g: [0,0,0,1,3,0], grp: "sus" },
  Dsus4: { f: [null,null,0,2,3,3], g: [0,0,0,1,3,4], grp: "sus" },
  Esus4: { f: [0,2,2,2,0,0], g: [0,2,3,4,0,0], grp: "sus" },
  Cadd9: { f: [null,3,2,0,3,3], g: [0,2,1,0,3,4], grp: "sus" },

        g.strokeStyle = col; g.lineWidth = 2; rrect(g, x - 11, y1, 22, y2 - y1, 9); g.stroke();
        if (ev.arrow) { g.fillStyle = col; g.font = "700 15px 'IBM Plex Sans', sans-serif"; g.textAlign = "center"; g.fillText(ev.arrow, x, (y1 + y2) / 2); }
        if (ev.label) { g.fillStyle = C.ink; g.font = "700 14px 'Bricolage Grotesque', sans-serif"; g.textAlign = "center"; g.fillText(ev.label, x, Math.max(10, y1 - 9)); }
      }
      if (ev.labels) Object.entries(ev.labels).forEach(([s, lab]) => {
        const y = ly(+s), w = Math.max(26, 9 * lab.length + 12);
        g.fillStyle = col; rrect(g, x - w / 2, y - laneH * 0.42, w, laneH * 0.84, 7); g.fill();
        g.fillStyle = C.panel; g.font = "600 13px 'IBM Plex Mono', monospace"; g.textAlign = "center"; g.fillText(lab, x, y + 1);
      });
      g.globalAlpha = 1;
    });
    // rating pop-ups
    const nowMs = performance.now();
    S.pops = S.pops.filter(p => nowMs - p.born < 1100);
    S.pops.forEach(p => {
      const k = (nowMs - p.born) / 1100, y = ly(p.lane) - 6 - k * 26;
      g.globalAlpha = 1 - k; g.textAlign = "left"; g.fillStyle = C[p.col];
      g.font = "700 15px 'Bricolage Grotesque', sans-serif"; g.fillText(p.text, hitX + 14, y);
      if (p.sub) { g.font = "500 11px 'IBM Plex Mono', monospace"; g.fillText(p.sub, hitX + 14, y + 15); }
      g.globalAlpha = 1;
    });
    // count-in / idle text
    g.textAlign = "center"; g.fillStyle = C.ink;
    if (S.running && vnow < t0) { g.font = "700 64px 'Bricolage Grotesque', sans-serif"; g.globalAlpha = 0.85; g.fillText(String(Math.ceil((t0 - vnow) / beat)), W * 0.58, H / 2); g.globalAlpha = 1; }
    if (!S.running) { g.font = "600 14px 'IBM Plex Sans', sans-serif"; g.fillStyle = C.muted; g.fillText(`Press Start: ${sp.bpb} clicks count you in, then play each note as it reaches the line`, W / 2, 14); }
  }
  function live() {
    const ov = S.ov, now = ac().currentTime - lat();
    const recent = S.frames.filter(f => f.t > now - 0.25);
    const fr = [...recent].reverse().find(f => f.f0);
    if (fr) { const m = 69 + 12 * Math.log2(fr.f0 / 440), n = Math.round(m), c = Math.round((m - n) * 100);
      $(".lp-n", ov).textContent = noteName(n); $(".lp-c", ov).textContent = `${fr.f0.toFixed(1)} Hz · ${c >= 0 ? "+" : ""}${c}¢`; }
    else if (recent.some(f => f.r > 0.01)) { $(".lp-n", ov).textContent = "Chord"; $(".lp-c", ov).textContent = "several notes at once"; }
    else { $(".lp-n", ov).textContent = "–"; $(".lp-c", ov).textContent = S.running ? "listening…" : ""; }
    // nearest target
    let tgt = null; if (S.running) S.inst.forEach(i => { const d = Math.abs(i.T - now); if (d < 0.6 && (!tgt || d < Math.abs(tgt.T - now))) tgt = i; });
    const needle = $(".cm-n", ov), lt = $(".lt-t", ov);
    if (tgt && (tgt.ev.kind === "note" || tgt.ev.kind === "notes")) {
      const tm = tgt.ev.midis[0], s = tgt.ev.lanes[0];
      lt.textContent = `Target: ${noteName(tm)} (string ${s}, fret ${tgt.ev.labels[s]})`;
      if (fr) { const m = 69 + 12 * Math.log2(fr.f0 / 440), d = m - tm, fold = d - 12 * Math.round(d / 12), c = Math.max(-50, Math.min(50, fold * 100));
        needle.style.left = (50 + c) + "%"; needle.style.background = Math.abs(c) <= 15 ? S.col.good : Math.abs(c) <= 40 ? S.col.brass : S.col.warn; needle.hidden = false; }
      else needle.hidden = true;
    } else { lt.textContent = tgt && tgt.ev.label ? `Target: ${tgt.ev.label} chord` : "Target: –"; needle.hidden = true; }
    // chroma bars
    const acc = new Float32Array(12); recent.forEach(f => { if (f.ch) for (let i = 0; i < 12; i++) acc[i] += f.ch[i]; });
    const mx = Math.max(...acc);
    const want = tgt ? new Set(tgt.ev.midis ? tgt.ev.midis.map(m => m % 12) : []) : new Set();
    $$(".chroma div", ov).forEach((d, i) => { const h = mx > 0 ? acc[i] / mx : 0; d.querySelector("i").style.height = Math.round(h * 100) + "%"; d.classList.toggle("want", want.has(i)); });
    const last = [...S.inst].reverse().find(i => i.res && i.res.match != null);
    $(".lc-m", ov).textContent = last ? `· last chord ${last.res.match}% match` : "";
  }
  if (location.hostname === "localhost") window.__gs = () => S; // local testing only
  return { open, close };
})();

// ================================================================= views
const C = window.COURSE;
const ALL = C.units.flatMap((u, ui) => u.lessons.map((l, li) => ({ ...l, unit: u, ui, li })));
const done = () => store.get("done", []);
function setDone(id, v) { const d = done().filter(x => x !== id); if (v) d.push(id); store.set("done", d); }
const seen = () => store.get("seen", []);
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 2 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

function renderBlock(b) {
  const el = document.createElement("div");
  if (b.p) { el.innerHTML = `<p>${md(b.p)}</p>`; return el.firstChild; }
  if (b.h) { el.innerHTML = `<h3>${md(b.h)}</h3>`; return el.firstChild; }
  if (b.list) { el.innerHTML = `<ul>${b.list.map(x => `<li>${md(x)}</li>`).join("")}</ul>`; return el.firstChild; }
  if (b.steps) { el.innerHTML = `<ol>${b.steps.map(x => `<li>${md(x)}</li>`).join("")}</ol>`; return el.firstChild; }
  if (b.tip) { el.className = "tip"; el.innerHTML = md(b.tip); return el; }
  for (const k of ["chords", "play", "tab", "fret", "changes", "quiz"]) if (b[k]) { W[k](el, b[k]); return el; }
  if (b.tuner) { W.tuner(el); return el; }
  return el;
}

function home() {
  const d = done(), sn = seen(), lastId = store.get("last", null), last = ALL.find(l => l.id === lastId);
  const next = last && !d.includes(last.id) ? last : (ALL.find((l, i) => !d.includes(l.id) && (!last || i > ALL.indexOf(last))) || ALL.find(l => !d.includes(l.id)) || ALL[0]);
  const pct = Math.round(100 * d.filter(id => ALL.some(l => l.id === id)).length / ALL.length);
  const log = Object.entries(store.get("log", {})).sort((a, b) => b[1].at - a[1].at).slice(0, 6);
  const v = $("#view"); v.innerHTML = `
  ${store.ok ? "" : `<p class="tip" style="border:1px solid var(--warn)"><b>Your progress isn't being saved.</b> This browser is blocking site storage, which usually means a private window or a setting that clears site data. Open the app in a normal window, or install it, to keep your progress.</p>`}
  <div class="hero"><div class="eyebrow">Acoustic guitar · ${C.units.length} units · ${ALL.length} lessons</div><h1>Practice Studio</h1>
    <p>${md(C.intro)}</p></div>
  <section class="card continue"><div style="display:grid;gap:8px;min-width:0"><div class="eyebrow">${sn.length ? "Pick up where you left off" : "Start here"} · Unit ${next.ui + 1}, lesson ${next.li + 1}</div>
    <h2>${md(next.title)}</h2><div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Course progress"><i style="width:${pct}%"></i></div><span class="hint">${d.length} of ${ALL.length} lessons complete (${pct}%)</span></div>
    <a class="btn primary" href="#l-${next.id}">${sn.length ? "Continue" : "Start lesson 1"} →</a></section>
  ${log.length ? `<section class="card"><h2>Practice log</h2><p class="muted">Your Play with mic results, newest first.</p><div class="log">${log.map(([k, r]) => { const lid = k.split("|")[0], ls = ALL.find(l => "l-" + l.id === lid);
      return `<a href="#${esc(lid)}"><span><b>${esc(r.title || "")}</b><small>${ls ? esc(ls.title) : "Tools"} · ${ago(r.at)}</small></span><span class="lg-n">${r.best}%<small>best at ${r.bestBpm} BPM</small></span></a>`; }).join("")}</div></section>` : ""}
  <section class="card"><h2>A 20-minute practice day</h2><p class="muted">Short daily sessions beat one long weekend session. Fingertips toughen and muscle memory forms overnight.</p>
    <div class="routine">${C.routine.map(r => `<div><b>${r[0]}</b><span>${md(r[1])}</span></div>`).join("")}</div></section>
  <div class="units">${C.units.map((u, ui) => `<article class="unit"><header><div class="eyebrow">Unit ${ui + 1} · ${u.lessons.filter(l => d.includes(l.id)).length}/${u.lessons.length} done</div><h2>${md(u.title)}</h2><p>${md(u.blurb)}</p></header>
    <ol>${u.lessons.map((l, li) => `<li class="${d.includes(l.id) ? "done" : sn.includes(l.id) ? "seen" : ""}"><a href="#l-${l.id}"><span class="dot">${d.includes(l.id) ? "✓" : li + 1}</span><span>${md(l.title)}</span><small>${l.id === lastId && !d.includes(l.id) ? "in progress" : l.mins + " min"}</small></a></li>`).join("")}</ol></article>`).join("")}</div>
  <section class="card"><h2>Back up your progress</h2>
    <p class="muted">Progress is saved automatically in this browser. To move it to another device or browser, copy a backup code here and paste it there.</p>
    <div class="row"><button class="bk-copy">Copy backup code</button><button class="bk-show">Restore from a code</button><span class="hint bk-msg" aria-live="polite"></span></div>
    <div class="bk-area" hidden><textarea id="bk-text" rows="3" style="width:100%;font:13px var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px" aria-label="Backup code"></textarea>
      <div class="row"><button class="primary bk-load">Restore this progress</button><span class="hint">This replaces the progress saved in this browser.</span></div></div></section>`;
  const enc = () => btoa(unescape(encodeURIComponent(JSON.stringify(store.dump()))));
  $(".bk-copy", v).onclick = async () => {
    const code = enc(), msg = $(".bk-msg", v);
    try { await navigator.clipboard.writeText(code); msg.textContent = "Copied. Paste it into Restore on your other device."; }
    catch (e) { $(".bk-area", v).hidden = false; $("#bk-text").value = code; $("#bk-text").select(); msg.textContent = "Select and copy the code below."; }
  };
  $(".bk-show", v).onclick = () => { $(".bk-area", v).hidden = false; $("#bk-text").value = ""; $("#bk-text").focus(); };
  $(".bk-load", v).onclick = () => {
    const msg = $(".bk-msg", v);
    try { const o = JSON.parse(decodeURIComponent(escape(atob($("#bk-text").value.trim()))));
      const keys = Object.keys(o).filter(k => k.startsWith("gs-")); if (!keys.length) throw 0;
      keys.forEach(k => localStorage.setItem(k, o[k])); home(); $(".bk-msg").textContent = "Progress restored.";
    } catch (e) { msg.textContent = "That code didn't work. Copy the whole code again and paste it in full."; }
  };
}

function lesson(id) {
  const i = ALL.findIndex(l => l.id === id); if (i < 0) return home();
  const l = ALL[i], prev = ALL[i - 1], next = ALL[i + 1], isDone = done().includes(l.id), checks = store.get("chk-" + l.id, []);
  const v = $("#view");
  v.innerHTML = `<article class="lesson read">
    <div class="lesson-head"><a class="eyebrow" href="#home" style="text-decoration:none">Unit ${l.ui + 1}: ${esc(l.unit.title)} · Lesson ${l.li + 1} of ${l.unit.lessons.length}</a>
      <h1>${md(l.title)}</h1><div class="meta"><span>≈ ${l.mins} min</span>${l.bpm ? `<span>target tempo ${l.bpm} BPM</span>` : ""}${isDone ? `<span style="color:var(--good)">✓ completed</span>` : ""}</div>
      <p class="goal">${md(l.goal)}</p></div>
    <div class="body"></div>
    <section class="card ready"><h2>You're ready to move on when…</h2>${l.ready.map((r, j) => `<label><input type="checkbox" id="chk-${l.id}-${j}" ${checks.includes(j) ? "checked" : ""}><span>${md(r)}</span></label>`).join("")}
      <div class="row"><button class="${isDone ? "" : "primary"} mark">${isDone ? "Mark as not done" : "Mark lesson complete"}</button></div></section>
    <nav class="pager" aria-label="Lessons">${prev ? `<a class="btn" href="#l-${prev.id}">← ${md(prev.title)}</a>` : "<span></span>"}${next ? `<a class="btn" href="#l-${next.id}">${md(next.title)} →</a>` : `<a class="btn" href="#home">Course map</a>`}</nav>
  </article>`;
  const body = $(".body", v); l.body.forEach(b => body.appendChild(renderBlock(b)));
  store.set("last", l.id); const sn = seen(); if (!sn.includes(l.id)) store.set("seen", [...sn, l.id]);
  $$(".ready input", v).forEach((c, j) => c.onchange = () => {
    const s = new Set(store.get("chk-" + l.id, [])); c.checked ? s.add(j) : s.delete(j); store.set("chk-" + l.id, [...s]);
    if (s.size === l.ready.length && !done().includes(l.id)) { setDone(l.id, true); const m = $(".mark", v); m.textContent = "✓ Completed · Next lesson →"; m.classList.add("primary"); m.dataset.next = "1"; }
  });
  $(".mark", v).onclick = e => {
    if (e.target.dataset.next) { if (next) location.hash = "#l-" + next.id; else location.hash = "#home"; return; }
    setDone(l.id, !isDone); if (!isDone && next) location.hash = "#l-" + next.id; else lesson(id);
  };
  // remember how far down the lesson you were
  const pos = store.get("pos", {})[l.id]; if (pos) setTimeout(() => window.scrollTo(0, pos), 60);
  clearTimeout(window.__posT);
  window.onscroll = () => { clearTimeout(window.__posT); window.__posT = setTimeout(() => { if (location.hash === "#l-" + l.id) { const p = store.get("pos", {}); p[l.id] = Math.round(window.scrollY); store.set("pos", p); } }, 400); };
}

function tools() {
  const v = $("#view");
  v.innerHTML = `<div class="hero"><div class="eyebrow">Standard tuning · E A D G B E</div><h1>Tools</h1><p>Tune up, look up any chord, and jam over your own progressions.</p></div>
    <div id="t-tuner"></div>
    <section class="card"><h2>Chord library <span class="hint" style="font:400 14px var(--body)">tap to hear</span></h2><div class="filters"></div><div id="t-chords"></div>
      <p class="hint">Numbers are fingers: 1 index, 2 middle, 3 ring, 4 pinky. ○ ring open, ✕ don't play. A bar shape means one finger presses several strings.</p></section>
    <div id="t-play"></div>`;
  W.tuner($("#t-tuner"));
  const groups = { all: "All", open: "Open", seventh: "7th", sus: "Sus & add", power: "Power", barre: "Barre" };
  let g = "all";
  const draw = () => { W.chords($("#t-chords"), Object.keys(CHORDS).filter(k => g === "all" || CHORDS[k].grp === g));
    $(".filters", v).innerHTML = Object.entries(groups).map(([k, n]) => `<button class="${k === g ? "on" : ""}" data-g="${k}">${n}</button>`).join("");
    $$(".filters button", v).forEach(b => b.onclick = () => { g = b.dataset.g; draw(); }); };
  draw();
  W.play($("#t-play"), { title: "Jam: metronome + strummer", editable: true, prog: ["G", "Em", "C", "D"], pattern: window.PATTERNS["Folk strum"].p, bpm: 80 });
}

function route() {
  stopAll(); stopMic(); Game.close();
  const h = location.hash.slice(1);
  $("#nav-home").classList.toggle("on", h !== "tools"); $("#nav-tools").classList.toggle("on", h === "tools");
  window.onscroll = null; window.scrollTo(0, 0);
  if (h === "tools") tools(); else if (h.startsWith("l-")) lesson(h.slice(2)); else home();
  const t = h.startsWith("l-") && ALL.find(l => l.id === h.slice(2)); document.title = t ? `${t.title} · Practice Studio` : "Practice Studio";
}
window.addEventListener("hashchange", route);
{ const last = store.get("last", null); if (!location.hash && last && ALL.some(l => l.id === last)) history.replaceState(null, "", "#l-" + last); }
route();

// ================================================================= install + offline
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvt;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#install").hidden = false; });
$("#install").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#install").hidden = true; };
window.addEventListener("appinstalled", () => { $("#install").hidden = true; });
</script>
